<div class="carousel" [class.carousel--fade-left]="canPrev()" [class.carousel--fade-right]="canNext()">
  <button
    type="button"
    class="carousel__arrow -left-1.5 md:-left-3"
    [disabled]="!canPrev()"
    aria-label="Ver anteriores"
    (click)="move(-1)"
  >
    <app-icon name="chevron-left" />
  </button>

  <div
    #viewport
    class="carousel__viewport"
    [class.carousel__viewport--dragging]="dragging()"
    (pointerdown)="startDrag($event)"
    (dragstart)="$event.preventDefault()"
  >
    <div
      #track
      class="carousel__track"
      [class.carousel__track--dragging]="dragging()"
      [style.transform]="'translateX(-' + visibleOffset() + 'px)'"
    >
      <ng-content />
    </div>
  </div>

  <button
    type="button"
    class="carousel__arrow -right-1.5 md:-right-3"
    [disabled]="!canNext()"
    aria-label="Ver más"
    (click)="move(1)"
  >
    <app-icon name="chevron-right" />
  </button>
</div>
