<section class="page mt-10 min-h-[60vh]">
  <button
    type="button"
    class="mb-6 inline-flex items-center gap-2 text-[13px] font-medium text-ink-2 transition-colors hover:text-accent"
    (click)="back()"
  >
    <app-icon name="arrow-left" /> {{ backLabel() }}
  </button>

  @if (!term()) {
    <div class="py-20 text-center">
      <h1 class="text-3xl">Buscá un juego</h1>
      <p class="mt-2 text-ink-2">Usá el buscador de arriba para comparar su precio en todas las tiendas.</p>
    </div>
  } @else {
    <p class="text-[13px] font-medium tracking-wide text-accent uppercase">Comparación de precios</p>
    <h1 class="mt-1 text-3xl sm:text-4xl">Resultados para «{{ term() }}»</h1>
    <app-price-comparison [term]="term()" />
  }
</section>
