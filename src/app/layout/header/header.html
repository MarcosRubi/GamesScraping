<header class="sticky top-0 z-50 border-b border-hairline bg-header/95 backdrop-blur">
  <div class="page relative flex h-16 items-center gap-6">
    <button
      type="button"
      class="-ml-1 rounded-full p-2 text-xl text-ink lg:hidden"
      aria-label="Abrir menú"
      (click)="mobileOpen.set(true)"
    >
      <app-icon name="menu" />
    </button>

    <a href="/" class="flex items-center gap-2 text-[19px] font-semibold tracking-tight text-ink" (click)="goHome($event)">
      <span class="grid size-8 place-items-center rounded-lg bg-accent text-base text-white"><app-icon name="controller" /></span>
      GameScraping<span class="-ml-2 text-accent">.</span>
    </a>

    <nav class="hidden items-center gap-1 lg:flex" aria-label="Principal">
      <button
        #megaTrigger
        type="button"
        class="flex items-center gap-1.5 rounded-full px-3 py-2 text-[14px] font-medium transition-colors hover:text-accent"
        [class.text-accent]="megaOpen()"
        [attr.aria-expanded]="megaOpen()"
        (click)="toggleMega()"
      >
        Explorar
        @if (filters.stores().length > 0) {
          <span class="grid h-4 min-w-4 place-items-center rounded-full bg-accent px-1 text-[10px] text-white">{{ filters.stores().length }}</span>
        }
        <app-icon name="chevron-down" class="text-[11px] transition-transform" [class.rotate-180]="megaOpen()" />
      </button>
      <a
        routerLink="/juegos"
        class="rounded-full px-3 py-2 text-[14px] font-medium transition-colors hover:text-accent"
        (click)="closePanels()"
      >
        Juegos
      </a>
      <a
        routerLink="/juegos"
        [queryParams]="offersLink"
        class="rounded-full px-3 py-2 text-[14px] font-medium transition-colors hover:text-accent"
        (click)="closePanels()"
      >
        Ofertas
      </a>
      <button
        #howTrigger
        type="button"
        class="flex items-center gap-1.5 rounded-full px-3 py-2 text-[14px] font-medium transition-colors hover:text-accent"
        [class.text-accent]="howOpen()"
        [attr.aria-expanded]="howOpen()"
        (click)="toggleHow()"
      >
        ¿Cómo funciona?
        <app-icon name="chevron-down" class="text-[11px] transition-transform" [class.rotate-180]="howOpen()" />
      </button>
    </nav>

    <div class="ml-auto flex items-center gap-2.5">
      <!-- Abre el buscador a pantalla completa -->
      <button
        type="button"
        class="hidden h-10 w-64 items-center justify-between rounded-full border border-hairline bg-bg pr-1 pl-4 text-[13px] text-ink-3 transition-colors hover:border-accent md:flex xl:w-72"
        (click)="ui.searchOpen.set(true)"
      >
        Buscar juegos...
        <span class="grid size-8 place-items-center rounded-full bg-accent text-sm text-white"><app-icon name="search" /></span>
      </button>
      <button
        type="button"
        class="grid size-10 place-items-center rounded-full bg-surface text-ink md:hidden"
        aria-label="Buscar"
        (click)="ui.searchOpen.set(true)"
      >
        <app-icon name="search" />
      </button>

      <span class="hidden h-6 w-px bg-hairline lg:block"></span>
      <app-currency-switch class="hidden sm:flex" />
      <app-theme-toggle />
    </div>
  </div>

  @if (howOpen()) {
    <div #howPanel class="absolute inset-x-0 top-full hidden border-b border-hairline bg-header shadow-float animate-dd-in lg:block">
      <div class="page py-8">
        <h2 class="mb-6 text-xl">¿Cómo funciona GameScraping?</h2>
        <app-how-it-works />
      </div>
    </div>
  }

  @if (megaOpen()) {
    <div #megaPanel class="absolute inset-x-0 top-full hidden lg:block">
      <app-mega-menu (navigate)="goToSection($event)" />
    </div>
  }
</header>

@if (mobileOpen()) {
  <app-mobile-menu (closed)="mobileOpen.set(false)" (navigate)="goToSection($event)" />
}
